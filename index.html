<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shlomi Vaknin - Home</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    
    <div id="channel-switch-effect"></div>

    <div class="home-container">
        
        <div class="typewriter">
            <h1>Head of the BIM Technology and Innovation Team</h1>
        </div>

        <div class="home-nav">
            <a href="about.html" class="main-btn">About Me</a>
            <a href="projects.html" class="main-btn">My Projects</a>
        </div>

    </div>

    <script>
        // העתקתי את לוגיקת המעבר הפשוטה אם תרצה אותה
        document.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', function(e) {
                // רק אם זה קישור פנימי
                if(this.hostname === window.location.hostname) {
                    e.preventDefault();
                    const href = this.getAttribute('href');
                    const effect = document.getElementById('channel-switch-effect');
                    
                    effect.style.opacity = '1'; // הפעלת רעש סטטי
                    
                    setTimeout(() => {
                        window.location.href = href;
                    }, 300);
                }
            });
        });
    </script>
</body>
</html>
