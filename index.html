<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shlomi Vaknin - Home</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    
    <div id="channel-switch-effect"></div>

    <video autoplay loop muted playsinline id="background-video">
        <source src="static/videos/moonwalk.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <img id="background-gif" src="static/images/static.gif" alt="Static Noise" />

    <audio id="audio-player" autoplay loop>
        <source src="static/music/Lucy_in_Disguise-1987.mp3" type="audio/mpeg">
    </audio>

    <div class="top-controls">
        <div id="channel-display">CH 01</div> 
        
        <button type="button" id="switch-channel-btn" class="retro-tv-btn">
            CH +
        </button>
    </div>

    <div class="home-container">
        
        <div class="typewriter">
            <h1>Head of the BIM Technology and Innovation Team</h1>
        </div>

        <div class="home-nav">
            <a href="about.html" class="main-btn">ABOUT ME</a>
            <a href="projects.html" class="main-btn">MY PROJECTS</a>
        </div>

    </div>

    <script src="static/js/script.js"></script>
    <script>
        // --- לוגיקת מעבר עמודים ---
        document.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', function(e) {
                if(this.hostname === window.location.hostname) {
                    e.preventDefault();
                    const href = this.getAttribute('href');
                    const effect = document.getElementById('channel-switch-effect');
                    effect.style.opacity = '1';
                    setTimeout(() => {
                        window.location.href = href;
                    }, 300);
                }
            });
        });
    </script>
</body>
</html>
