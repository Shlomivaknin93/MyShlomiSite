<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Projects</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>

    <div id="channel-switch-effect"></div>

    <div class="top-left-button">
        <a href="index.html" class="button">HOME</a>
    </div>

    <img id="background-gif" src="static/images/static.gif" alt="Static Noise" style="display: block;" />

    <div class="projects-hub">
        <h2 class="section-title">&lt; SELECT_PROJECT_CHANNEL /&gt;</h2>
        <p class="hub-subtitle">Choose a frequency</p>

        <div class="hub-nav">
            <a href="habitat.html" class="hub-btn hub-btn-habitat">
                <span class="hub-ch">CH HAB</span>
                <span class="hub-label">Private Project — HABITAT</span>
                <span class="hub-desc">LUNA-TWIN · Lunar Digital Twin</span>
            </a>

            <a href="office-projects.html" class="hub-btn hub-btn-office">
                <span class="hub-ch">CH OFF</span>
                <span class="hub-label">OFFICE PROJECT</span>
                <span class="hub-desc">BIM · Automation · Office AI</span>
            </a>
        </div>
    </div>

    <script>
        document.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', function (e) {
                if (this.hostname === window.location.hostname) {
                    e.preventDefault();
                    const href = this.getAttribute('href');
                    const effect = document.getElementById('channel-switch-effect');
                    effect.style.opacity = '1';
                    setTimeout(() => { window.location.href = href; }, 300);
                }
            });
        });
    </script>
</body>
</html>
