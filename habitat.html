<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HABITAT · Under Construction</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body class="habitat-page">

    <div id="channel-switch-effect"></div>

    <div class="luna-nav">
        <a href="projects.html" class="button">EXIT</a>
    </div>

    <img id="background-gif" src="static/images/static.gif" alt="" style="display: block;" />

    <div class="habitat-building">
        <div class="habitat-signal">
            <span class="status-dot"></span>
            CH HAB
        </div>
        <h1 class="luna-logo">HABITAT</h1>
        <p class="habitat-building-text">
            בבנייה
            <span class="thinking-dots" aria-hidden="true">
                <span></span><span></span><span></span>
            </span>
        </p>
    </div>

    <script>
        document.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', function (e) {
                if (this.hostname === window.location.hostname) {
                    e.preventDefault();
                    const href = this.getAttribute('href');
                    const effect = document.getElementById('channel-switch-effect');
                    effect.style.opacity = '1';
                    setTimeout(() => { window.location.href = href; }, 300);
                }
            });
        });
    </script>
</body>
</html>
