<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUNA-TWIN</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body class="habitat-page">

    <div id="channel-switch-effect"></div>

    <div class="luna-nav">
        <a href="projects.html" class="button">EXIT</a>
    </div>

    <img id="background-gif" src="static/images/static.gif" alt="" style="display: block;" />

    <div class="luna-app">

        <header class="luna-topbar">
            <div class="luna-brand-block">
                <h1 class="luna-logo">LUNA-TWIN</h1>
                <span class="luna-sub">Hab-Module-Alpha · Twin Link Active</span>
            </div>
            <div class="luna-top-meta">
                <div class="luna-live">
                    <span class="status-dot"></span>
                    <span id="hab-status-label">Hab Status: Nominal</span>
                </div>
                <div class="luna-crew">Crew: <strong>4 / 4</strong></div>
            </div>
        </header>

        <div class="mission-stats">
            <div class="mission-stat">
                <span class="stat-label">OXYGEN (O2)</span>
                <span class="stat-value" id="stat-o2">98.4%</span>
            </div>
            <div class="mission-stat">
                <span class="stat-label">POWER RESERVE</span>
                <span class="stat-value" id="stat-power">97.1%</span>
            </div>
            <div class="mission-stat">
                <span class="stat-label">WATER RECYCLE</span>
                <span class="stat-value" id="stat-water">92.0%</span>
            </div>
            <div class="mission-stat">
                <span class="stat-label">SYSTEM HEALTH</span>
                <span class="stat-value" id="stat-health">94</span>
            </div>
        </div>

        <div class="luna-main">

            <section class="luna-panel luna-spatial">
                <div class="card-header">
                    <span class="status-dot"></span> SPATIAL_HABITAT_MODEL
                </div>
                <div class="spatial-stage" id="spatial-stage">
                    <div class="spatial-module" data-module="A">
                        <span class="module-label">MODULE A · ECLSS</span>
                        <button type="button" class="spatial-node" data-id="ECLSS-PMP-001" title="ECLSS-PMP-001"></button>
                        <button type="button" class="spatial-node" data-id="ECLSS-SCR-002" title="ECLSS-SCR-002"></button>
                    </div>
                    <div class="spatial-module" data-module="B">
                        <span class="module-label">MODULE B · POWER</span>
                        <button type="button" class="spatial-node" data-id="PWR-BAT-001" title="PWR-BAT-001"></button>
                    </div>
                    <div class="spatial-module" data-module="C">
                        <span class="module-label">MODULE C · WATER</span>
                        <button type="button" class="spatial-node" data-id="WTR-RCL-001" title="WTR-RCL-001"></button>
                    </div>
                    <div class="spatial-corridor"></div>
                </div>
                <div class="spatial-legend">
                    <span><i class="lg lg-ok"></i> Operational</span>
                    <span><i class="lg lg-warn"></i> Warning</span>
                    <span><i class="lg lg-fail"></i> Failed</span>
                    <span><i class="lg lg-sel"></i> Selected</span>
                </div>
            </section>

            <aside class="luna-side">
                <section class="luna-panel luna-detail">
                    <div class="card-header">
                        <span class="status-dot"></span> SELECTED_ASSET
                    </div>
                    <div class="detail-body" id="asset-detail"></div>
                    <button type="button" class="retro-tv-btn mission-fail-btn" id="simulate-fail-btn">
                        SIMULATE FAILURE
                    </button>
                </section>

                <section class="luna-panel mission-chat">
                    <div class="card-header">
                        <span class="status-dot"></span> ASK_THE_HABITAT
                    </div>
                    <div class="chat-log" id="chat-log"></div>
                    <form class="chat-form" id="chat-form">
                        <input
                            type="text"
                            id="chat-input"
                            placeholder="Which systems fail if ECLSS pump stops?"
                            autocomplete="off"
                        />
                        <button type="submit" class="retro-tv-btn">SEND</button>
                    </form>
                </section>
            </aside>

        </div>

        <ul class="asset-rail" id="asset-list" hidden></ul>

    </div>

    <script src="static/js/habitat.js"></script>
    <script>
        document.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', function (e) {
                if (this.hostname === window.location.hostname) {
                    e.preventDefault();
                    const href = this.getAttribute('href');
                    const effect = document.getElementById('channel-switch-effect');
                    effect.style.opacity = '1';
                    setTimeout(() => { window.location.href = href; }, 300);
                }
            });
        });
    </script>
</body>
</html>
